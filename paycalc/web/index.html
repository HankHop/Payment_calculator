<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paycheck Calculator</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1b2430; --muted: #5d6b7b; --line: #dfe3e8;
  --accent: #1f5fbf; --accent-ink: #ffffff; --ok: #1d7a46; --ok-bg: #e5f4ea;
  --warn: #8a5a00; --warn-bg: #fff2d6; --bad: #a52a2a; --bad-bg: #fde8e8; --zero: #a52a2a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12161c; --panel: #1a2029; --ink: #e6ebf1; --muted: #9aa8b8; --line: #2c3541;
    --accent: #6aa3f2; --accent-ink: #0d1520; --ok: #6fd39a; --ok-bg: #173424;
    --warn: #f1c366; --warn-bg: #3a2d10; --bad: #f19a9a; --bad-bg: #3b1d1d; --zero: #f19a9a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
  padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
h1 { font-size: 17px; margin: 0; }
.status { color: var(--muted); font-size: 13px; }
button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  padding: 6px 12px; border-radius: 6px; cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.link { border: none; background: none; color: var(--accent); padding: 2px 4px; }
button.danger { color: var(--bad); }
.layout { display: grid; grid-template-columns: minmax(320px, 430px) 1fr; gap: 16px; padding: 16px; align-items: start; }
@media (max-width: 960px) { .layout { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
.card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
label { display: block; font-size: 12px; color: var(--muted); }
label[title] { cursor: help; }
[hidden] { display: none !important; }
td.bad { color: var(--bad); font-weight: 650; }
header nav.seg { margin: 0; }
label > input, label > select { display: block; width: 100%; margin-top: 2px; }
input, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 7px; min-width: 0; }
input:disabled { opacity: .5; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--ink); margin: 6px 0; }
label.check > input { display: inline-block; width: auto; margin: 3px 0 0; flex: none; }
label.check { color: var(--ink); }
.hint { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
.item { border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin: 8px 0; }
.item .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-weight: 600; }
.notice { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 10px; margin: 8px 0; font-size: 13px; }
.error { background: var(--bad-bg); color: var(--bad); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
.banner { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 12px; margin: 12px 16px 0; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 12px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-size: 20px; font-weight: 650; margin-top: 2px; }
.stat .s { font-size: 12px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
.seg button { border: none; border-radius: 0; background: var(--panel); }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 4px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
tr.section td { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding-top: 10px; border-bottom: none; }
tr.total td { font-weight: 650; border-top: 2px solid var(--line); }
td.note { text-align: left; white-space: normal; min-width: 220px; }
td.zero { color: var(--zero); font-weight: 600; }
.pill { display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: 12px; }
.pill.full { background: var(--ok-bg); color: var(--ok); }
.pill.takehome, .pill.limit { background: var(--warn-bg); color: var(--warn); }
.warnlist { margin: 0; padding-left: 18px; }
.warnlist li { margin: 3px 0; }
.dim { opacity: .55; }
details > summary { cursor: pointer; font-weight: 600; margin-bottom: 8px; }
.foot { color: var(--muted); font-size: 12px; margin-top: 6px; }
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.on { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>Paycheck Calculator</h1>
  <nav class="seg" id="tabs"><button data-tab="calc" class="on">Calculator</button><button data-tab="hh">Household</button></nav>
  <div class="status" id="status">Loading…</div>
  <div id="calcbar">
    <label for="who" class="status">Person</label>
    <select id="who" title="Whose inputs and results you are editing. Your spouse's inputs are saved with the household."><option value="you">You</option><option value="spouse">Spouse</option></select>
    <label for="plan" class="status">Plan</label>
    <select id="plan" title="Saved plans. 'main' is your real inputs."></select>
    <button id="rollover" title="Create a new plan for a later year from what is on screen">Plan next year</button>
    <button id="reset" title="Replace the form with the example numbers">Reset to example</button>
    <button id="save" class="primary">Save inputs</button>
  </div>
  <div id="hhbar" hidden><button id="hhsave" class="primary">Save household</button></div>
</header>
<div id="banner" class="banner" hidden></div>
<div class="layout" id="calcview">
  <div id="form"></div>
  <div id="results"></div>
</div>
<div class="layout" id="hhview" hidden>
  <div id="hhform"></div>
  <div id="hhresults"></div>
</div>
<div id="toast" role="status"></div>

<script>
"use strict";
let S = {};            // the form state: same shape as config.json
let META = {states: []};
let VIEW = "recommended";
let SEQ = 0, TIMER = null, LAST = null, EXAMPLE = null;

const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = (n, d = 2) => (n < 0 ? "-" : "") + "$" + Math.abs(n).toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d});
const pct = (n) => (n == null ? "" : (+n).toString() + "%");

// ---- state helpers --------------------------------------------------------
function getPath(o, p) { return p.split(".").reduce((a, k) => (a == null ? undefined : a[k]), o); }
const UNSAFE_KEYS = new Set(["__proto__", "constructor", "prototype"]);
function setPath(o, p, v) {
  const keys = p.split(".");
  if (keys.some((k) => UNSAFE_KEYS.has(k))) return;
  let cur = o;
  keys.slice(0, -1).forEach((k, i) => {
    if (cur[k] == null) cur[k] = /^\d+$/.test(keys[i + 1]) ? [] : {};
    cur = cur[k];
  });
  const last = keys[keys.length - 1];
  if (v === undefined) { delete cur[last]; } else { cur[last] = v; }
}
function ensure() {
  S.pay = S.pay || {}; S.pay.bonuses = S.pay.bonuses || [];
  if (S.pay.bonus) { S.pay.bonuses.unshift(S.pay.bonus); delete S.pay.bonus; }
  S.contributions = S.contributions || {};
  S.contributions.elections = S.contributions.elections || [];
  sortElections();
  S.contributions.employer = S.contributions.employer || {};
  S.deductions = S.deductions || {};
  S.withholding = S.withholding || {};
  S.withholding.changes = S.withholding.changes || [];
  sortByDate(S.withholding.changes);
  S.recommendation = S.recommendation || {};
}
function sortByDate(list) {
  // Oldest first; entries without a date yet stay at the end. Array.sort is stable.
  const key = (e) => e.effective_date || "9999-12-31";
  list.sort((a, b) => (key(a) < key(b) ? -1 : key(a) > key(b) ? 1 : 0));
}
function sortElections() { sortByDate(S.contributions.elections); }
function clean(v) {
  if (Array.isArray(v)) return v.map(clean);
  if (v && typeof v === "object") {
    const o = {};
    for (const [k, x] of Object.entries(v)) {
      if (UNSAFE_KEYS.has(k)) continue;
      const c = clean(x);
      if (c === null || c === undefined || c === "") continue;
      if (typeof c === "number" && Number.isNaN(c)) continue;
      o[k] = c;
    }
    return o;
  }
  return v;
}

// ---- form pieces ----------------------------------------------------------
function val(p) { const v = getPath(S, p); return v == null ? "" : v; }
function num(p, label, hint = "", extra = "") {
  return `<label>${label}<input type="number" step="any" data-p="${p}" data-t="num" value="${esc(val(p))}" ${extra}></label>${hint ? `<div class="hint">${hint}</div>` : ""}`;
}
function txt(p, label, type = "text", t = "str", hint = "") {
  return `<label>${label}<input type="${type}" data-p="${p}" data-t="${t}" value="${esc(val(p))}"></label>${hint ? `<div class="hint">${hint}</div>` : ""}`;
}
function sel(p, label, opts, t = "str", rerender = false) {
  const cur = String(val(p));
  const o = opts.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === cur ? "selected" : ""}>${esc(l)}</option>`).join("");
  return `<label>${label}<select data-p="${p}" data-t="${t}" ${rerender ? "data-re=1" : ""}>${o}</select></label>`;
}
function tri(p, label, hint = "") {
  return sel(p, label, [["", "Use my default"], ["true", "Yes"], ["false", "No"]], "tri") + (hint ? `<div class="hint">${hint}</div>` : "");
}
function chk(p, label, rerender = false) {
  return `<label class="check"><input type="checkbox" data-p="${p}" data-t="bool" ${rerender ? "data-re=1" : ""} ${getPath(S, p) ? "checked" : ""}><span>${label}</span></label>`;
}

function renderForm() {
  ensure();
  const c = S.contributions, afterTax = c.posttax_type === "after_tax", ack = !!c.acknowledge_mega_backdoor;
  const postOn = !afterTax || ack;
  const states = META.states.map((s) => [s.code, s.name]);
  const r = S.pay.raise, hasRaise = !!r;
  const raiseMode = r && r.new_salary != null && r.percent == null ? "new_salary" : "percent";
  const freq = S.pay.frequency;

  let h = `<div class="card"><h2>You</h2><div class="grid2">
    ${sel("filing_status", "Filing status", [["single","Single"],["mfj","Married filing jointly"],["mfs","Married filing separately"],["hoh","Head of household"]])}
    ${sel("state", "State", states.length ? states : [[S.state || "TX", S.state || "TX"]])}
    ${num("age_end_of_year", "Age at year end", "50+ adds catch-up limits")}
    ${txt("as_of_date", "As-of date", "date", "str")}
  </div><div class="hint">As-of date: paychecks on or before it keep your actual elections and the recommendation applies to later ones. Leave empty to plan the whole year.</div>
  <div class="grid2" style="margin-top:8px">${num("monthly_expenses", "Monthly expenses (optional)")}</div></div>`;

  h += `<div class="card"><h2>Pay</h2><div class="grid2">
    ${num("pay.base_salary", "Base salary")}
    ${sel("pay.frequency", "Pay frequency", [["weekly","Weekly"],["biweekly","Every 2 weeks"],["semimonthly","Twice a month"],["monthly","Monthly"]], "str", true)}
    ${(freq === "weekly" || freq === "biweekly") ? txt("pay.first_pay_date", "Any real pay date", "date") : ""}
  </div>
  <label class="check"><input type="checkbox" data-p="_hasRaise" data-t="bool" ${hasRaise ? "checked" : ""}><span>I get a raise this year</span></label>`;
  if (hasRaise) {
    h += `<div class="item"><div class="grid2">
      ${txt("pay.raise.effective_date", "Effective date", "date")}
      <label>Raise as<select data-act="raise-mode"><option value="percent" ${raiseMode==="percent"?"selected":""}>Percent</option><option value="new_salary" ${raiseMode==="new_salary"?"selected":""}>New salary</option></select></label>
      ${raiseMode === "percent" ? num("pay.raise.percent", "Percent raise") : num("pay.raise.new_salary", "New salary")}
    </div></div>`;
  }
  h += `<h2 style="margin-top:12px">Bonuses</h2>`;
  S.pay.bonuses.forEach((b, i) => {
    const mode = b.percent_of_salary != null && b.amount == null ? "percent_of_salary" : "amount";
    h += `<div class="item"><div class="head"><span>${esc(b.name || "Bonus " + (i + 1))}</span><button class="link danger" data-act="del-bonus" data-i="${i}">Remove</button></div>
      <div class="grid2">
        ${txt(`pay.bonuses.${i}.name`, "Name (e.g. retention)")}
        ${txt(`pay.bonuses.${i}.pay_date`, "Pay date", "date")}
        <label>Amount as<select data-act="bonus-mode" data-i="${i}"><option value="amount" ${mode==="amount"?"selected":""}>Dollars</option><option value="percent_of_salary" ${mode==="percent_of_salary"?"selected":""}>% of salary</option></select></label>
        ${num(`pay.bonuses.${i}.${mode}`, mode === "amount" ? "Dollars" : "% of salary")}
        ${mode === "percent_of_salary" ? num(`pay.bonuses.${i}.payout_multiplier_percent`, "Company payout %", "Leave empty for 100%. 106 means 6% above target") : ""}
        ${tri(`pay.bonuses.${i}.eligible_for_employee_contributions`, "My 401(k) % applied to it?", "No = percentages use base pay only. Its cash still counts as take-home, so it can cover the election on that paycheck.")}
        ${tri(`pay.bonuses.${i}.eligible_for_match`, "Employer match on it?")}
        ${tri(`pay.bonuses.${i}.eligible_for_nonelective`, "Employer unmatched on it?")}
      </div>
      ${chk(`pay.bonuses.${i}.separate_paycheck`, "Separate off-cycle paycheck (otherwise added to the regular paycheck on that date)")}
    </div>`;
  });
  h += `<button data-act="add-bonus">+ Add a bonus</button></div>`;

  h += `<div class="card"><h2>401(k) elections</h2>
    ${sel("contributions.posttax_type", "Post-tax money is", [["roth","Roth 401(k)"],["after_tax","After-tax, non-Roth (mega backdoor)"]], "str", true)}`;
  if (afterTax) {
    h += `${chk("contributions.acknowledge_mega_backdoor", "I understand after-tax contributions only make sense if my plan allows an in-plan Roth conversion or an in-service rollover to a Roth IRA (mega backdoor Roth).", true)}`;
    if (!ack) h += `<div class="notice">After-tax figures are hidden and ignored until you confirm above.</div>`;
  }
  c.elections.forEach((e, i) => {
    h += `<div class="item"><div class="head"><span>Election ${i + 1}</span>${c.elections.length > 1 ? `<button class="link danger" data-act="del-election" data-i="${i}">Remove</button>` : ""}</div>
      <div class="grid2">
        ${txt(`contributions.elections.${i}.effective_date`, "Takes effect on pay date", "date")}
        ${num(`contributions.elections.${i}.pretax_percent`, "Pretax %")}
        ${postOn ? num(`contributions.elections.${i}.posttax_percent`, (afterTax ? "After-tax" : "Roth") + " %") : ""}
      </div></div>`;
  });
  h += `<button data-act="add-election">+ Add an election change</button>
    <div class="hint">Each election applies from its date onward. Elections re-order themselves by date when you change a date, so you can add one for an earlier date. Percentages are of eligible pay; elections near 100% take whatever is left after taxes, HSA, premiums and pretax.</div>
    ${chk("contributions.bonus_eligible_for_employee_contributions", "Default: my 401(k) % is applied to bonuses (unchecked = base pay only; bonus cash still counts as take-home)")}
  </div>`;

  const wi = S.what_if;
  h += `<div class="card"><h2>What if I change my contributions?</h2>
    <label class="check"><input type="checkbox" data-p="_hasWhatIf" data-t="bool" ${wi ? "checked" : ""}><span>Estimate a change</span></label>`;
  if (wi) {
    h += `<div class="item"><div class="grid2">
      ${txt("what_if.effective_date", "First paycheck it applies to", "date")}
      ${num("what_if.pretax_percent", "Pretax %")}
      ${postOn ? num("what_if.posttax_percent", (afterTax ? "After-tax" : "Roth") + " %") : ""}
    </div></div>
    <div class="hint">Payroll often needs about two weeks, so enter the first paycheck that will actually change. Elections before that date stay as entered above; later ones are replaced. Shown next to the recommendation.</div>`;
  }
  h += `</div>`;

  h += `<div class="card"><h2>Employer</h2><div class="grid2">
    ${num("contributions.employer.match_rate_percent", "Match rate %", "50 = 50 cents per dollar")}
    ${num("contributions.employer.match_up_to_percent_of_pay", "…up to % of pay")}
    ${num("contributions.employer.nonelective_percent", "Unmatched contribution %")}
  </div>
  ${chk("contributions.employer.bonus_eligible_for_match", "Default: match is paid on bonuses")}
  ${chk("contributions.employer.bonus_eligible_for_nonelective", "Default: unmatched contribution is paid on bonuses")}</div>`;

  h += `<div class="card"><h2>Payroll deductions (per regular paycheck)</h2><div class="grid2">
    ${num("deductions.hsa_per_paycheck", "HSA", S.deductions && S.deductions.hsa_max_out ? "Ignored: max-out is on" : "")}
    ${sel("deductions.hsa_coverage", "HSA coverage", [["","Skip limit check"],["self","Self-only"],["family","Family"]])}
    ${num("deductions.hsa_limit_override", "HSA annual limit (optional)", "Overrides the built-in limit, e.g. when this year's limit is newer than the app")}
    ${num("deductions.hsa_employer_annual", "Employer HSA contribution (per year)", "Counts toward the annual limit")}
    ${num("deductions.other_pretax_per_paycheck", "Premiums / FSA (pretax)")}
    ${num("deductions.other_posttax_per_paycheck", "Other post-tax")}
  </div>
  ${chk("deductions.hsa_max_out", "Max out my HSA: (annual limit - employer contribution) / paychecks, needs HSA coverage set", true)}</div>`;

  h += `<div class="card"><h2>Tax withholding (W-4)</h2>
    <div class="hint" style="margin:0 0 8px">What payroll takes from each paycheck. Bonuses are withheld at a flat rate; the year's actual tax is still calculated separately and compared to what is withheld.</div>
    ${num("withholding.supplemental_rate_percent", "Bonus federal withholding %", "Leave empty for 22%")}`;
  (S.withholding.changes).forEach((w, i) => {
    h += `<div class="item"><div class="head"><span>W-4 setting ${i + 1}</span><button class="link danger" data-act="del-w4" data-i="${i}">Remove</button></div>
      <div class="grid2">
        ${txt(`withholding.changes.${i}.effective_date`, "Takes effect on pay date", "date")}
        ${num(`withholding.changes.${i}.extra_federal_per_paycheck`, "Extra withholding per paycheck", "W-4 step 4(c)")}
        ${num(`withholding.changes.${i}.regular_federal_per_paycheck`, "Regular federal withholding per paycheck", "Leave empty to estimate")}
      </div>
      ${chk(`withholding.changes.${i}.multiple_jobs`, "W-4 step 2 box: multiple jobs / spouse works")}</div>`;
  });
  h += `<button data-act="add-w4">+ Add a W-4 change</button>
    <div class="hint">Each setting applies from its date onward. Add one dated at the start of the year for your original W-4, then another when you updated it.</div></div>`;

  h += `<div class="card"><h2>Recommendation settings</h2><div class="grid2">
    ${txt("recommendation.target_employee_contribution", "Pretax/Roth target ($ or max)", "text", "maxnum")}
    ${afterTax && ack ? txt("recommendation.target_total_additions", "Total target ($, max or none)", "text", "maxnum") : ""}
    ${!afterTax ? num("recommendation.expected_retirement_marginal_rate_percent", "Retirement tax rate %", "Decides pretax vs Roth") : ""}
    ${num("recommendation.percent_step", "Plan percent step")}
    ${num("recommendation.plan_max_percent", "Plan max %")}
  </div></div>`;

  $("form").innerHTML = h;
  applyTips();
}


// ---- hover help ------------------------------------------------------------------
const TIPS = {
  "filing_status": "Sets the federal brackets, standard deduction and the wage base used for tax. Changing it changes taxes, take-home pay and the refund or amount owed. Spouse income is not modeled either way.",
  "state": "Picks the state income tax rules. No-income-tax states (TX, FL...) show zero state tax. Changing it changes taxes and take-home pay only; the 401(k) math is the same.",
  "age_end_of_year": "Your age on Dec 31. At 50 or older the 401(k) catch-up applies, and at 55 or older the HSA catch-up applies, which raise the limits the calculator enforces.",
  "as_of_date": "The date your numbers are current through. Paychecks on or before it keep the elections you actually had and are locked as history; the recommendation only applies to paychecks after it. Empty plans the whole year from January.",
  "monthly_expenses": "Optional. Only used to compare take-home pay against your spending in the monthly view. It does not change any tax or contribution result.",
  "pay.base_salary": "Annual salary before any raise. Regular paychecks are this divided by the number of pay periods. Percent-of-pay contributions, match and bonuses by percent all key off it.",
  "pay.frequency": "How often you are paid. Sets the number of regular paychecks (52, 26, 24 or 12), which drives per-paycheck amounts, HSA and how many paychecks remain to reach a limit.",
  "pay.first_pay_date": "Any one real pay date. The rest of the year's weekly or biweekly dates are counted from it. Only matters for weekly and biweekly pay.",
  "_hasRaise": "Turns on a mid-year raise. Paychecks from the effective date use the new salary; earlier ones use the base salary.",
  "pay.raise.effective_date": "First pay date paid at the new salary.",
  "pay.raise.percent": "Raise as a percent of the base salary, for example 6 for 6%.",
  "pay.raise.new_salary": "The full annual salary after the raise, instead of a percent.",
  "pay.bonuses.*.name": "A label only. It shows in the paycheck list.",
  "pay.bonuses.*.pay_date": "The pay date the bonus arrives. It is taxed and counted in the year of this date.",
  "pay.bonuses.*.amount": "Gross bonus in dollars, before tax.",
  "pay.bonuses.*.percent_of_salary": "Gross bonus as a percent of base salary. Dollars are worked out for you.",

function applyTips() {

function convert(el) {
  const t = el.dataset.t;
  if (t === "num") return el.value === "" ? undefined : parseFloat(el.value);
  if (t === "bool") return el.checked;
  if (t === "tri") return el.value === "" ? undefined : el.value === "true";
  if (t === "maxnum") { const v = el.value.trim().toLowerCase(); return v === "" ? undefined : (v === "max" || v === "none") ? v : (isFinite(v) ? parseFloat(v) : el.value); }
  return el.value === "" ? undefined : el.value;
}
$("form").addEventListener("input", onEdit);
$("form").addEventListener("change", onEdit);
function onEdit(ev) {
  const el = ev.target;
  if (el.dataset.act === "raise-mode") {
    const r = S.pay.raise || {}; const v = r.percent ?? r.new_salary;
    delete r.percent; delete r.new_salary; r[el.value] = v; S.pay.raise = r; renderForm(); return schedule();
  }
  if (el.dataset.act === "bonus-mode") {
    const b = S.pay.bonuses[+el.dataset.i]; const v = b.amount ?? b.percent_of_salary;
    delete b.amount; delete b.percent_of_salary; if (el.value === "amount") delete b.payout_multiplier_percent; b[el.value] = v; renderForm(); return schedule();
  }
  const p = el.dataset.p; if (!p) return;
  if (p === "_hasWhatIf") {
    if (el.checked) {
      const last = S.contributions.elections[S.contributions.elections.length - 1] || {};
      const d = new Date(S.as_of_date || Date.now()); d.setDate(d.getDate() + 15);
      S.what_if = {effective_date: d.toISOString().slice(0, 10), pretax_percent: last.pretax_percent ?? 0, posttax_percent: last.posttax_percent ?? 0};
    } else delete S.what_if;
    renderForm(); return schedule();
  }
  if (p === "_hasRaise") {
    if (el.checked) S.pay.raise = {effective_date: "", percent: 3}; else delete S.pay.raise;
    renderForm(); return schedule();
  }
  setPath(S, p, convert(el));
  if (ev.type === "change" && /^contributions\.elections\.\d+\.effective_date$/.test(p)) { sortElections(); renderForm(); }
  else if (ev.type === "change" && /^withholding\.changes\.\d+\.effective_date$/.test(p)) { sortByDate(S.withholding.changes); renderForm(); }
  else if (ev.type === "change" && el.dataset.re) renderForm();
  schedule();
}
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("button[data-act]"); if (!b) return;
  const i = +b.dataset.i, a = b.dataset.act;
  if (a === "add-bonus") S.pay.bonuses.push({name: "", pay_date: "", amount: 0});
  else if (a === "del-bonus") S.pay.bonuses.splice(i, 1);
  else if (a === "add-election") { const e = S.contributions.elections; const last = e[e.length - 1] || {};
    e.push({effective_date: "", pretax_percent: last.pretax_percent ?? 0, posttax_percent: last.posttax_percent ?? 0}); }
  else if (a === "del-election") S.contributions.elections.splice(i, 1);
  else if (a === "add-w4") S.withholding.changes.push({effective_date: "", extra_federal_per_paycheck: 0, multiple_jobs: false});
  else if (a === "del-w4") S.withholding.changes.splice(i, 1);

  S = w === "you" ? YOU : SPOUSE;
  $("who").value = w;
  $("plan").disabled = $("rollover").disabled = $("reset").disabled = w === "spouse";
  $("save").textContent = w === "spouse" ? "Save household" : "Save inputs";
  applyBanner(); ensure(); renderForm(); LAST = null; calc();
}
$("who").addEventListener("change", () => setWho($("who").value));
function setTab(t) {
  TAB = t;
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === t));
  $("calcview").hidden = t !== "calc"; $("hhview").hidden = t !== "hh";
  $("calcbar").hidden = t !== "calc"; $("hhbar").hidden = t !== "hh";
  applyBanner();
  if (t === "hh") { renderHHForm(); calcHH(); }
}
$("tabs").addEventListener("click", (ev) => { const b = ev.target.closest("button[data-tab]"); if (b) setTab(b.dataset.tab); });

async function saveHousehold() {
  const body = {household: clean(HH), spouse: SPOUSE ? clean(JSON.parse(JSON.stringify(SPOUSE))) : null};
  const res = await fetch("/api/household/save", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const d = await res.json();
  if (res.ok) { SPOUSE_NEW = false; toast("Saved to " + d.saved); applyBanner(); } else toast(d.error || "Could not save");
}
$("hhsave").addEventListener("click", saveHousehold);

const hval = (p) => { const v = getPath(HH, p); return v == null ? "" : v; };
function hnum(p, label, hint = "") {
  return `<label>${label}<input type="number" step="any" data-h="${p}" data-t="num" value="${esc(hval(p))}"></label>${hint ? `<div class="hint">${hint}</div>` : ""}`;
}
function htxt(p, label) {
  return `<label>${label}<input type="text" maxlength="60" data-h="${p}" data-t="str" value="${esc(hval(p))}"></label>`;
}
function hsel(p, label, opts) {
  const cur = String(hval(p));
  return `<label>${label}<select data-h="${p}" data-t="num">${opts.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === cur ? "selected" : ""}>${esc(l)}</option>`).join("")}</select></label>`;
}
function hsels(p, label, opts) {
  const cur = String(hval(p));
  return `<label>${label}<select data-h="${p}" data-t="str">${opts.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === cur ? "selected" : ""}>${esc(l)}</option>`).join("")}</select></label>`;
}
function renderHHForm() {
  HH = hhNormalize(HH);
  let h = `<div class="card"><h2>Household</h2>`;
  h += SPOUSE ? `<div class="hint" style="margin:0 0 6px">Your spouse's pay is set up under Calculator > Person > Spouse.</div>`
              : `<div class="notice">Your spouse's inputs are not set up yet. Switch Person to Spouse on the Calculator tab and enter their salary and contributions.</div>`;
  h += `<div class="grid2">
    ${hnum("split_you_percent", "Your share of joint bills %", "The rest is your spouse's")}
    ${hnum("inheritance_balance", "Inheritance available", "At the start month below")}
    ${hsel("start_month", "Start month", [["", "Auto (after as-of date)"], ...MN.slice(1).map((m, i) => [i + 1, m])])}
    ${hsels("spouse_scenario", "Spouse's contributions", [["current", "Current"], ["recommended", "Recommended"]])}
  </div></div>`;
  h += `<div class="card"><h2>Costs and budgets (per month)</h2>
    <div class="hint" style="margin:0 0 6px">Assign each cost to an account. Only the budgeted amount is counted: spending above a personal budget is not covered by the joint account or the inheritance.</div>`;
  HH.expenses.forEach((e, i) => {
    h += `<div class="item"><div class="head"><span>${esc(e.name || "Cost " + (i + 1))}</span><button class="link danger" data-hact="del" data-i="${i}">Remove</button></div>
      <div class="grid2">
        ${htxt(`expenses.${i}.name`, "Name (e.g. daughter's clothes)")}
        ${hnum(`expenses.${i}.monthly`, "Monthly budget")}
        ${hsels(`expenses.${i}.account`, "Paid from", [["joint", "Joint account"], ["you", "My personal account"], ["spouse", "Spouse's personal account"]])}
      </div></div>`;
  });
  h += `<button data-hact="add">+ Add a cost</button></div>`;
  $("hhform").innerHTML = h; applyTips();
}
$("hhform").addEventListener("click", (ev) => {
  const b = ev.target.closest("button[data-hact]"); if (!b) return;
  if (b.dataset.hact === "add") HH.expenses.push({name: "", monthly: 0, account: "joint"});
  else HH.expenses.splice(+b.dataset.i, 1);
  renderHHForm(); scheduleHH();
});
function onHHEdit(ev) {
  const el = ev.target, p = el.dataset.h; if (!p) return;
  setPath(HH, p, convert(el)); scheduleHH();
}
$("hhform").addEventListener("input", onHHEdit);
$("hhform").addEventListener("change", onHHEdit);
function scheduleHH() { clearTimeout(HHTIMER); $("status").textContent = "Calculating…"; HHTIMER = setTimeout(calcHH, 350); }
async function calcHH() {
  if (TAB !== "hh") return;
  const my = ++HHSEQ;
  if (!SPOUSE) { $("hhresults").innerHTML = ""; $("status").textContent = "Set up spouse"; return; }
  try {
    const copy = (o) => clean(JSON.parse(JSON.stringify(o)));
    const res = await fetch("/api/household/analyze", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({you: copy(YOU), spouse: copy(SPOUSE), household: copy(HH)})});
    const d = await res.json();
    if (my !== HHSEQ) return;
    if (!res.ok) { $("hhresults").innerHTML = `<div class="error">${esc(d.error || "Could not calculate")}</div>`; $("status").textContent = "Needs attention"; return; }
    HHLAST = d; $("status").textContent = "Up to date"; renderHH();
  } catch (e) {
    if (my !== HHSEQ) return;
    $("hhresults").innerHTML = `<div class="error">Could not reach the calculator.</div>`; $("status").textContent = "Needs attention";
  }
}
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("button[data-hview]"); if (!b) return;
  HHVIEW = b.dataset.hview; renderHH();
});
function renderHH() {
  const d = HHLAST; if (!d) return;
  const sc = d.scenarios.find((x) => x.key === HHVIEW) || d.scenarios[0];
  const t = sc.totals, m = d.meta;
  let h = "";
  if (d.warnings.length) h += `<div class="notice"><ul class="warnlist">${d.warnings.map((w) => `<li>${esc(w)}</li>`).join("")}</ul></div>`;
  h += `<div class="card"><h2>Scenarios, ${MN[m.start_month]} to Dec</h2><div class="tablewrap"><table><thead><tr><th>Your elections</th><th>Pretax / post-tax</th><th>Your total additions</th><th>Limit reached</th><th>You send to joint</th><th>Spouse sends</th><th>Inheritance used</th><th>Inheritance left</th><th>Unfunded</th></tr></thead><tbody>` +
    d.scenarios.map((x) => `<tr><td>${esc(x.label)}</td><td>${x.you_pretax_percent}% / ${x.you_posttax_percent}%</td><td>${money(x.you_total_additions, 0)}</td><td>${esc(x.you_limit_reached_on || "-")}</td><td>${money(x.totals.you_from_pay, 0)}</td><td>${money(x.totals.spouse_from_pay, 0)}</td><td>${money(x.totals.inheritance_used, 0)}</td><td>${money(x.totals.inheritance_end, 0)}</td><td class="${x.totals.unfunded > 0.005 ? "bad" : ""}">${money(x.totals.unfunded, 0)}</td></tr>`).join("") +
    `</tbody></table></div></div>`;
  h += `<div class="seg">${d.scenarios.map((x) => `<button data-hview="${esc(x.key)}" class="${x.key === sc.key ? "on" : ""}">${esc(x.label)}</button>`).join("")}</div>`;
  h += `<div class="stats">
    <div class="stat"><div class="k">You send to joint</div><div class="v">${money(t.you_per_paycheck_avg)}</div><div class="s">per paycheck, average</div></div>
    <div class="stat"><div class="k">Spouse sends to joint</div><div class="v">${money(t.spouse_per_paycheck_avg)}</div><div class="s">per paycheck, average</div></div>
    <div class="stat"><div class="k">Inheritance used</div><div class="v">${money(t.inheritance_used, 0)}</div><div class="s">${money(t.inheritance_end, 0)} left at year end</div></div>
    <div class="stat"><div class="k">Unfunded joint bills</div><div class="v">${money(t.unfunded, 0)}</div><div class="s">after the inheritance runs out</div></div>
  </div>`;
  h += `<div class="card"><h2>${esc(sc.label)}, month by month</h2><div class="tablewrap"><table><thead><tr><th>Month</th><th>Joint bills</th><th>Your net pay</th><th>Your own costs</th><th>You send</th><th>Your joint gap</th><th>Spouse net pay</th><th>Spouse's own costs</th><th>Spouse sends</th><th>Spouse joint gap</th><th>Inheritance used</th><th>Inheritance left</th><th>Unfunded</th></tr></thead><tbody>` +
    sc.months.map((r) => `<tr><td>${MN[r.month]}</td><td>${money(r.joint_expenses, 0)}</td><td>${money(r.you_net, 0)}</td><td class="${r.you_own_shortfall > 0.005 ? "bad" : ""}">${money(r.you_family_expenses, 0)}</td><td>${money(r.you_to_joint, 0)}</td><td>${money(r.you_shortfall, 0)}</td><td>${money(r.spouse_net, 0)}</td><td class="${r.spouse_own_shortfall > 0.005 ? "bad" : ""}">${money(r.spouse_family_expenses, 0)}</td><td>${money(r.spouse_to_joint, 0)}</td><td>${money(r.spouse_shortfall, 0)}</td><td>${money(r.inheritance_used, 0)}</td><td>${money(r.inheritance_balance, 0)}</td><td class="${r.unfunded > 0.005 ? "bad" : ""}">${money(r.unfunded, 0)}</td></tr>`).join("") +
    `</tbody></table></div><div class="foot">Net pay is cash after payroll withholding. "Joint gap" is the part of a person's share of joint bills that their pay cannot cover; the inheritance covers it. Own costs shown in red are more than that person's pay can cover and are not paid from the joint account or inheritance.</div></div>`;
  $("hhresults").innerHTML = h;
}

(async function init() {
  META = await (await fetch("/api/meta")).json();
  await loadPlans("main"); await loadConfig();
  const hd = await (await fetch("/api/household")).json();
  HH = hhNormalize(hd.household); SPOUSE = hd.spouse; HHPATH = hd.path || "";
})();
</script>
</body>
</html>
